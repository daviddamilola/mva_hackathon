name: pypgx
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::pypgx=0.27.0
  # pandas 3.x (new default string dtype) breaks pypgx 0.27.0 at api/genotype.py:643; the recipe
  # does not cap pandas, so pin the 2.x line explicitly
  - conda-forge::pandas=2.3.3
  - bioconda::samtools=1.22.1
  - bioconda::bcftools=1.22
  - bioconda::htslib=1.22.1
  - conda-forge::python=3.12.11
