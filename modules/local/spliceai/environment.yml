name: spliceai
channels:
  - conda-forge
  - bioconda
  - nodefaults
# strict conda-forge/bioconda only: mixing Anaconda 'defaults' tensorflow with conda-forge
# libprotobuf gives an ABI error at import. Pins verified with a positive control
# (synthetic BUB1B donor disruption -> DS_DL 0.99), see docs/04.
dependencies:
  - bioconda::spliceai=1.3.1
  - conda-forge::tensorflow=2.21.0
  - conda-forge::numpy=1.26.4          # spliceai 1.3.1 uses np.fromstring binary mode (removed in numpy 2)
  - conda-forge::setuptools=75.8.2     # spliceai imports pkg_resources (dropped from newer setuptools)
  - conda-forge::python=3.12.11
  - bioconda::htslib=1.22.1
